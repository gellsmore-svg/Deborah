[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deborah"
version = "0.12.0"
description = "Deborah — Cairn process language and thin PLAN interpreter for framed cross-LLM work."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "gellsmore-svg"},
]
keywords = ["process", "plan", "agentic", "governance", "grammar", "conformance", "llm", "capability", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
# Dependency-free by default so the conformance and render surfaces can be
# adopted by any runtime — verified by importing with every optional dependency
# blocked. If Keturah is installed, deborah.manifest uses it; otherwise Deborah
# provides a small compatible manifest. The human-systems analysis that used to
# ship in this package now lives in Huldah.
dependencies = []

[project.scripts]
deborah-render = "deborah.cli:main"
deborah-validate = "deborah.validate_cli:main"
deborah-serve = "deborah.web:main"
deborah-run = "deborah.runtime.cli:main"

[project.urls]
Homepage = "https://github.com/gellsmore-svg/Deborah"
Repository = "https://github.com/gellsmore-svg/Deborah"
Issues = "https://github.com/gellsmore-svg/Deborah/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "fastapi>=0.110", "uvicorn>=0.29", "httpx", "pyyaml>=6.0"]
render = ["pyyaml>=6.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
export = ["python-docx>=1.0", "fpdf2>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deborah = ["py.typed"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly rather than inheriting ruff's defaults: ruff 0.16
# widened those defaults, which silently turns a green gate red on a tool
# upgrade. This is the historical default set (pyflakes + the pycodestyle
# errors worth gating), so the gate means the same thing on every ruff version.
select = ["E4", "E7", "E9", "F"]
